server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ips-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ips_db}
    username: ${POSTGRES_USER:ips_user}
    password: ${POSTGRES_PASSWORD:ips_pass}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ips_user}
    password: ${RABBITMQ_PASS:ips_pass}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        concurrency: 1        # processa um lote por vez — protege contra race condition no estoque
        max-concurrency: 1
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0     # backoff exponencial: 1s → 2s → 4s, depois dead-letter

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.pricing: DEBUG
    org.springframework.amqp: INFO